name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download real FFmpeg
        shell: powershell
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip

          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force

          $ffmpeg = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (-not $ffmpeg) { throw "Khong tim thay ffmpeg.exe" }
          if (-not $ffprobe) { throw "Khong tim thay ffprobe.exe" }

          Copy-Item $ffmpeg.FullName "$env:GITHUB_WORKSPACE\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$env:GITHUB_WORKSPACE\ffprobe.exe"

          & "$env:GITHUB_WORKSPACE\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe khong chay duoc" }

          Get-Item "$env:GITHUB_WORKSPACE\ffmpeg.exe" | Select-Object Name,Length
          Get-Item "$env:GITHUB_WORKSPACE\ffprobe.exe" | Select-Object Name,Length
      - name: Publish Windows App
        run: dotnet publish NTS.TaoMP4.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Copy FFmpeg and logo
        shell: powershell
        run: |
          Copy-Item ffmpeg.exe publish\ffmpeg.exe
          Copy-Item ffprobe.exe publish\ffprobe.exe
          New-Item -ItemType Directory -Force publish\Assets | Out-Null
          Copy-Item Assets\logo.png publish\Assets\logo.png

      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path publish\* -DestinationPath NTS-Tao-MP4-V1-Windows.zip

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: NTS-Tao-MP4-V1-Windows
          path: NTS-Tao-MP4-V1-Windows.zip
